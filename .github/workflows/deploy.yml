name: Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "acc"
        type: choice
        options:
          - acc
          - prd
  pull_request:

jobs:
  verify:
    name: Verify Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  deploy-prd:
    name: Deploy → PRD
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prd'
    runs-on: ubuntu-latest
...
  deploy-acc:
    name: Deploy → ACC
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'acc'
    runs-on: ubuntu-latest
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare Workers (prd)
        run: bunx wrangler deploy --config dist/server/wrangler.json --env prd
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-acc:
    name: Deploy → ACC
    if: github.ref == 'refs/heads/acc'
    runs-on: ubuntu-latest
    environment: acc
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare Workers (acc)
        run: bunx wrangler deploy --config dist/server/wrangler.json --env acc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
